name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # macOS, weil StemLab dafür gebaut ist. Die Tests selbst brauchen weder
    # GPU noch Modelle – sie erzeugen ihr Material synthetisch.
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Testabhängigkeiten installieren
        # Bewusst nicht requirements.txt: dort hängen PyTorch und die
        # Trennmodelle drin, das wären Gigabyte für jeden Lauf. Die Tests
        # decken Analyse, Tags und API ab, die mit diesen Paketen auskommen.
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy scipy librosa soundfile mutagen fastapi httpx python-multipart

      - name: Tests
        run: python -m pytest
